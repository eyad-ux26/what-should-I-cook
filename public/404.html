<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>What Should I Cook?</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrites, so a direct visit or refresh on a
      // route like /privacy hits this 404 page. It re-encodes the path into a query
      // string and redirects to the real index page, which decodes it back (see
      // /spa-redirect.js) before the app renders — the visitor ends up on a clean,
      // crawlable /privacy URL with no visible redirect flash.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
