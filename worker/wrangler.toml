name = "what-should-i-cook-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

[observability]
enabled = true

# Custom domain for the API — Cloudflare provisions DNS + SSL for this
# automatically on deploy once what-should-i-cook.com is an active zone in
# this Cloudflare account (see project notes for the one manual step needed).
[[routes]]
pattern = "api.what-should-i-cook.com"
custom_domain = true

[[durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiterDO"

[[durable_objects.bindings]]
name = "METRICS_DO"
class_name = "MetricsDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MetricsDO"]

# Operational limits — plain (non-secret) vars so they're easy to tune without
# touching code. Every one has a built-in fallback in src/index.ts, so an
# unset value never disables a protection. AI_ENABLED, MISTRAL_API_KEY,
# ADMIN_TOKEN, and TURNSTILE_SECRET_KEY are set as `wrangler secret put ...`
# instead, since secrets can be changed without a redeploy.
[vars]
RATE_LIMIT_MAX = "20"
RATE_LIMIT_WINDOW_SECONDS = "60"
BURST_LIMIT = "10"
BURST_WINDOW_SECONDS = "10"
DAILY_LIMIT = "150"
DAILY_WINDOW_SECONDS = "86400"
MAX_CONCURRENT_PER_IP = "2"
FAILURE_LIMIT = "10"
FAILURE_WINDOW_SECONDS = "300"
MAX_INGREDIENTS = "25"
MAX_INGREDIENT_LENGTH = "60"
LIST_MAX_TOKENS = "1400"
DETAIL_MAX_TOKENS = "900"
MAX_BODY_BYTES = "20000"
TURNSTILE_ENABLED = "false"

# --- /monitor (internal dashboard) ---
# ADMIN_TOKEN (secret, required): `wrangler secret put ADMIN_TOKEN` — a long
#   random string only you know. Without it, /monitor is permanently locked.
# ADMIN_EMAILS (plain var, optional): comma-separated email(s). Only
#   meaningful once Cloudflare Access is configured in the dashboard for
#   api.what-should-i-cook.com/monitor* — now possible since /monitor is
#   served from a real custom domain instead of a workers.dev subdomain.
#   Leave unset until Access is actually configured there.
# ADMIN_EMAILS = "you@example.com"
